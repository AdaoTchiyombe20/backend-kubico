openapi: 3.0.3
info:
  title: Kubico API
  version: 1.0.0
  description: |
    API da Kubico para cadastro, publicacao, negociacao e pagamento de imoveis.

    Como usar:
    - Envie o access token no header: `Authorization: Bearer <token>`.
    - O refresh token e salvo em cookie `refreshToken`.
    - Rotas publicas de listagem aceitam token opcional. Com token, a API oculta os imoveis do proprio utilizador.
    - IDs de `client_id` e `owner_id` em pagamentos/negociacoes representam `profile_roles.id`, nao `users.id`.
  contact:
    name: Kubico Support
    email: adaotchiyombe@gmail.com

servers:
  - url: http://localhost:4000/api
    description: Local
  - url: https://backend-kubico-production.up.railway.app/api
    description: Producao

tags:
  - name: Auth
    description: Criacao de conta, login, refresh e admin auth.
  - name: Users
    description: Dados da conta autenticada.
  - name: Profiles
    description: Dados para ativar perfil de proprietario.
  - name: Roles
    description: Troca da role ativa no token.
  - name: Properties
    description: Cadastro e gestao de imoveis.
  - name: Listings
    description: Imoveis publicados para consulta.
  - name: Favorites
    description: Favoritos do cliente.
  - name: Negotiations
    description: Propostas e historico de negociacao.
  - name: Payments
    description: Pagamento simulado e retencao/liberacao.
  - name: Admin
    description: Consultas administrativas.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
      description: Quantidade maxima de itens retornados.
    Cursor:
      name: cursor
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Cursor numerico para paginacao.
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Dados invalidos!

    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operacao realizada com sucesso.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: joao@kubico.ao
        password:
          type: string
          example: password123

    SignupRequest:
      allOf:
        - $ref: "#/components/schemas/LoginRequest"

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: usuario com sessao iniciada!
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          type: object
          properties:
            id:
              type: integer
              example: 1
            email:
              type: string
              example: joao@kubico.ao

    CreateAdminRequest:
      type: object
      required: [adminsName, email, password, accessLevel]
      properties:
        adminsName:
          type: string
          example: Admin Kubico
        email:
          type: string
          format: email
          example: admin@kubico.ao
        password:
          type: string
          minLength: 3
          example: password123
        accessLevel:
          type: string
          enum: [NORMAL, SUPER_ADMIN]
          example: NORMAL

    UpdateEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: novo@kubico.ao

    UpdatePasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 6
          example: novaSenha123

    IndividualOwnerRequest:
      type: object
      required: [ownerName, phone, bi, bankAccount, dateOfBirth]
      properties:
        ownerName:
          type: string
          example: Joao Silva
        phone:
          type: string
          example: "923456789"
        bi:
          type: string
          minLength: 14
          maxLength: 14
          example: "123456789LA042"
        bankAccount:
          type: string
          minLength: 25
          maxLength: 25
          example: "0040000000000000000000000"
        dateOfBirth:
          type: string
          description: Formato DD-MM-YYYY.
          example: "20-05-1994"

    CompanyOwnerRequest:
      type: object
      required: [nameOfCompany, phone, nif, bankAccount]
      properties:
        nameOfCompany:
          type: string
          example: Kubico Imobiliaria
        phone:
          type: string
          example: "923456789"
        nif:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"
        bankAccount:
          type: string
          minLength: 31
          maxLength: 31
          example: "0040000000000000000000000000000"

    Property:
      type: object
      properties:
        id:
          type: integer
          example: 10
        id_owner:
          type: integer
          description: ID da role OWNER (`profile_roles.id`).
          example: 4
        title:
          type: string
          example: Apartamento T3 em Talatona
        type_property_purchase:
          type: string
          enum: [FOR_SALE, FOR_RENT]
          example: FOR_SALE
        type_of_property:
          type: string
          example: APARTAMENTO
        description:
          type: string
          example: Imovel com boa localizacao.
        status_property:
          type: string
          enum: [PUBLICADO, NAO_PUBLICADO, EM_ANALISE]
          example: PUBLICADO
        is_negotiable:
          type: boolean
          example: false
        price:
          type: number
          example: 25000000
        total_area:
          type: number
          nullable: true
          example: 120

    Listing:
      type: object
      properties:
        id:
          type: integer
          example: 5
        property_id:
          type: integer
          example: 10
        status:
          type: string
          enum: [DISPONIVEL, RESERVADO, VENDIDO, ALUGADO]
          example: DISPONIVEL
        property:
          $ref: "#/components/schemas/Property"

    CreatePropertyMultipart:
      type: object
      required:
        - title
        - description
        - address_info
        - neighborhood
        - municipality
        - price
        - type_purchase
        - type_of_property
        - compartments
        - images
      properties:
        title:
          type: string
          example: Apartamento T3 em Talatona
        description:
          type: string
          example: Apartamento espacoso, pronto a habitar.
        address_info:
          type: string
          example: Rua 21, Talatona
        neighborhood:
          type: string
          example: Talatona
        municipality:
          type: string
          example: Luanda
        price:
          type: string
          example: "25000000"
        is_negotiable:
          type: string
          enum: ["true", "false"]
          example: "false"
        total_area:
          type: string
          example: "120"
        latitude:
          type: string
          example: "-8.9167"
        longitude:
          type: string
          example: "13.1833"
        type_purchase:
          type: string
          enum: [FOR_SALE, FOR_RENT]
          example: FOR_SALE
        type_of_property:
          type: string
          example: APARTAMENTO
        compartments:
          type: string
          description: JSON em string.
          example: '[{"type":"QUARTO","quantity":3},{"type":"COZINHA","quantity":1}]'
        images:
          type: array
          items:
            type: string
            format: binary
        video:
          type: string
          format: binary

    UpdatePropertyRequest:
      type: object
      properties:
        title:
          type: string
          example: Apartamento T3 remodelado
        description:
          type: string
        price:
          type: string
          example: "27000000"
        is_negotiable:
          type: boolean
          example: true
        address_info:
          type: string
        neighborhood:
          type: string
        municipality:
          type: string
        type_purchase:
          type: string
          enum: [FOR_SALE, FOR_RENT]
        type_of_property:
          type: string
        compartments:
          type: string
          example: '[{"type":"QUARTO","quantity":3}]'

    NegotiationRequest:
      type: object
      required: [property_id, offer_price]
      properties:
        property_id:
          type: integer
          example: 10
        offer_price:
          type: number
          example: 23000000
        months:
          type: integer
          example: 12
        message:
          type: string
          example: Tenho interesse no imovel.

    NegotiationAction:
      type: object
      required: [negociation_id]
      properties:
        negociation_id:
          type: integer
          example: 1
        message:
          type: string
          example: Proposta analisada.

    AcceptNegotiationRequest:
      allOf:
        - $ref: "#/components/schemas/NegotiationAction"
        - type: object
          required: [accepted_value]
          properties:
            accepted_value:
              type: number
              example: 23500000

    CounterOfferRequest:
      allOf:
        - $ref: "#/components/schemas/NegotiationAction"
        - type: object
          required: [counter_price]
          properties:
            counter_price:
              type: number
              example: 24000000

    PaymentRequest:
      type: object
      required: [property_listing_id, paymentType]
      properties:
        property_listing_id:
          type: integer
          example: 5
        listed_property_id:
          type: integer
          description: Alias aceito para property_listing_id.
          example: 5
        paymentType:
          type: string
          enum: [DIRECT_PURCHASE, NEGOCIATED_PURCHASE]
          example: DIRECT_PURCHASE

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        cursor:
          type: integer
          nullable: true
          example: 10
        hasNextPage:
          type: boolean
          example: false
        data:
          type: array
          items:
            type: object

paths:
  /auth/signup/{type}:
    post:
      tags: [Auth]
      summary: Criar conta
      description: Cria utilizador e devolve accessToken. O type deve ser `individual` ou `company`.
      security: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [individual, company]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Conta criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Dados invalidos ou email ja cadastrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login de utilizador
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sessao iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Credenciais invalidas.

  /auth/logout:
    get:
      tags: [Auth]
      summary: Terminar sessao
      description: Requer cookie `refreshToken`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout realizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /auth/refresh:
    get:
      tags: [Auth]
      summary: Renovar accessToken
      description: Usa o cookie `refreshToken` e devolve novo par de tokens.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token renovado.

  /auth/verify-email:
    get:
      tags: [Auth]
      summary: Verificar email
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verificado.

  /auth/send-verify-mail:
    get:
      tags: [Auth]
      summary: Reenviar email de verificacao
      description: Atualmente o envio de email pode estar ignorado pelo servico.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pedido processado.

  /auth/create-admin:
    post:
      tags: [Auth]
      summary: Criar admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminRequest"
      responses:
        "200":
          description: Admin criado.

  /auth/login-admin:
    post:
      tags: [Auth]
      summary: Login de admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Admin autenticado.

  /users:
    get:
      tags: [Users]
      summary: Buscar dados do utilizador autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Utilizador encontrado.
    delete:
      tags: [Users]
      summary: Apagar conta autenticada
      description: Requer cookie `refreshToken`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conta apagada.

  /users/update-email:
    put:
      tags: [Users]
      summary: Atualizar email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmailRequest"
      responses:
        "200":
          description: Email atualizado.

  /users/update-password:
    patch:
      tags: [Users]
      summary: Atualizar password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordRequest"
      responses:
        "200":
          description: Password atualizada.

  /profile/individual-owner:
    post:
      tags: [Profiles]
      summary: Cadastrar dados de proprietario individual
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndividualOwnerRequest"
      responses:
        "201":
          description: Dados cadastrados.

  /profile/company-owner:
    post:
      tags: [Profiles]
      summary: Cadastrar dados de proprietario empresa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyOwnerRequest"
      responses:
        "201":
          description: Dados cadastrados.

  /assume-roles/client:
    get:
      tags: [Roles]
      summary: Ativar role CLIENT
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role atualizada. Chame `/auth/refresh` para atualizar o token.

  /assume-roles/owner:
    get:
      tags: [Roles]
      summary: Ativar role OWNER
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role atualizada. Chame `/auth/refresh` para atualizar o token.

  /properties/listings:
    get:
      tags: [Listings]
      summary: Listar imoveis publicados
      description: Publico. Se enviar token, os imoveis do proprio utilizador sao ocultados.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Lista de anuncios.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cursor:
                    type: integer
                    nullable: true
                  properties:
                    type: array
                    items:
                      $ref: "#/components/schemas/Listing"

  /properties/listings/search:
    get:
      tags: [Listings]
      summary: Filtrar imoveis publicados
      description: Publico. Com token, exclui os imoveis do proprio utilizador.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: type_purchase
          in: query
          schema:
            type: string
            enum: [FOR_SALE, FOR_RENT]
        - name: type_of_property
          in: query
          schema:
            type: string
            example: APARTAMENTO
        - name: municipality
          in: query
          schema:
            type: string
        - name: neighborhood
          in: query
          schema:
            type: string
        - name: min_price
          in: query
          schema:
            type: number
        - name: max_price
          in: query
          schema:
            type: number
        - name: is_negotiable
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Lista filtrada.

  /properties/listings/{id}:
    get:
      tags: [Listings]
      summary: Detalhe de anuncio
      security: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Anuncio encontrado.

  /properties:
    get:
      tags: [Properties]
      summary: Listar todos os imoveis
      description: Apenas ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Lista de imoveis.
    post:
      tags: [Properties]
      summary: Criar imovel
      description: Apenas OWNER. Envie multipart/form-data com imagens.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreatePropertyMultipart"
      responses:
        "201":
          description: Imovel criado.

  /properties/owner:
    get:
      tags: [Properties]
      summary: Listar meus imoveis
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Imoveis do proprietario autenticado.

  /properties/publish/{id}:
    post:
      tags: [Properties]
      summary: Publicar imovel
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Imovel publicado.

  /properties/unpublish/{id}:
    post:
      tags: [Properties]
      summary: Despublicar imovel
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Imovel despublicado.

  /properties/{id}/info:
    patch:
      tags: [Properties]
      summary: Atualizar informacoes do imovel
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePropertyRequest"
      responses:
        "200":
          description: Imovel atualizado.

  /properties/{id}/media:
    post:
      tags: [Properties]
      summary: Adicionar media ao imovel
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Media adicionada.

  /properties/{id}/media/{mediaId}:
    patch:
      tags: [Properties]
      summary: Substituir media do imovel
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Media atualizada.
    delete:
      tags: [Properties]
      summary: Remover media do imovel
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Media removida.

  /properties/{id}:
    delete:
      tags: [Properties]
      summary: Apagar imovel
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Imovel apagado.

  /properties/favorites:
    get:
      tags: [Favorites]
      summary: Listar favoritos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Favoritos do cliente.

  /properties/favorites/{id}:
    post:
      tags: [Favorites]
      summary: Adicionar favorito
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Favorito adicionado.
    delete:
      tags: [Favorites]
      summary: Remover favorito
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Favorito removido.

  /negotiations/init:
    post:
      tags: [Negotiations]
      summary: Criar proposta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NegotiationRequest"
      responses:
        "201":
          description: Negociacao iniciada.

  /negotiations/accept:
    post:
      tags: [Negotiations]
      summary: Aceitar proposta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptNegotiationRequest"
      responses:
        "200":
          description: Proposta aceita.

  /negotiations/reject:
    post:
      tags: [Negotiations]
      summary: Rejeitar proposta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NegotiationAction"
      responses:
        "200":
          description: Proposta rejeitada.

  /negotiations/counter-offer:
    post:
      tags: [Negotiations]
      summary: Enviar contraproposta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CounterOfferRequest"
      responses:
        "200":
          description: Contraproposta enviada.

  /negotiations/cancel:
    post:
      tags: [Negotiations]
      summary: Cancelar negociacao
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NegotiationAction"
      responses:
        "200":
          description: Negociacao cancelada.

  /negotiations:
    get:
      tags: [Negotiations]
      summary: Listar minhas negociacoes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Negociacoes do utilizador.

  /negotiations/{negociation_id}/history:
    get:
      tags: [Negotiations]
      summary: Historico da negociacao
      security:
        - bearerAuth: []
      parameters:
        - name: negociation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Historico encontrado.

  /negotiations/sentProposals:
    get:
