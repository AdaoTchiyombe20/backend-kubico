openapi: 3.0.0
info:
  title: Kubico API
  version: 1.0.0
  description: |
    API documentation for Kubico — Plataforma web para arrendamento e venda de imóveis.

    > **⚠️ Legenda de estado dos endpoints:**
    > - ✅ **Funcional** — Implementado e operacional
    > - 🚧 **Em desenvolvimento** — Rota registada mas ainda sem implementação
    > - ❌ **Não implementado** — Definido no contrato mas ainda não criado
  contact:
    name: Kubico Support
    email: adaotchiyombe@gmail.com

servers:
  - url: http://localhost:4000/api
    description: Development server
  - url: https://backend-kubico-production.up.railway.app/api
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── Auth ───────────────────────────────────────────────
    SignUpRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: joao@example.com
        password:
          type: string
          minLength: 6
          example: password123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: joao@example.com
        password:
          type: string
          example: password123

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    # ─── User ────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: joao@example.com
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
          example: ACTIVE
        email_verified:
          type: boolean
          example: false
        date_register:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z

    UpdateEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: newemail@example.com

    # ─── Admin ──────────────────────────────────────────────
    CreateAdminRequest:
      type: object
      required: [adminsName, email, password, accessLevel]
      properties:
        adminsName:
          type: string
          minLength: 3
          example: Admin Kubico
        email:
          type: string
          format: email
          example: admin@kubico.com
        password:
          type: string
          minLength: 3
          example: strongPassword123
        accessLevel:
          type: string
          enum: [SUPER_ADMIN, NORMAL]
          example: NORMAL

    # ─── Profiles / Verification ────────────────────────────
    IndividualOwnerProfileRequest:
      type: object
      required: [ownerName, phone, bi, nif, bankAccount, dateOfBirth]
      properties:
        ownerName:
          type: string
          minLength: 3
          example: João Silva
        phone:
          type: string
          minLength: 9
          maxLength: 9
          pattern: '^[0-9]{9}$'
          example: "923456789"
        bi:
          type: string
          minLength: 14
          maxLength: 14
          example: "12345678901234"
        nif:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"
        bankAccount:
          type: string
          minLength: 21
          maxLength: 21
          example: "123456789012345678901"
        dateOfBirth:
          type: string
          format: date
          example: "1990-01-01"

    CompanyOwnerProfileRequest:
      type: object
      required: [nameOfCompany, phone, nif, bankAccount]
      properties:
        nameOfCompany:
          type: string
          minLength: 3
          example: Empresa XYZ
        phone:
          type: string
          minLength: 9
          maxLength: 9
          pattern: '^[0-9]{9}$'
          example: "923456789"
        nif:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"
        bankAccount:
          type: string
          minLength: 21
          maxLength: 21
          example: "123456789012345678901"

    # ─── Properties ──────────────────────────────────────────
    Property:
      type: object
      properties:
        id:
          type: integer
          example: 1
        id_owner:
          type: integer
          example: 5
        title:
          type: string
          example: Apartamento T3 em Talatona
        description:
          type: string
          example: Apartamento espaçoso com 3 quartos e varanda
        type_of_property:
          type: string
          enum:
            - APARTAMENTO
            - VIVENDA
            - ESCRITORIO
            - FAZENDA
            - TERRENO
            - LOJA
            - ARMAZEM
            - HOTEL
            - PENTHOUSE
            - DUPLEX
            - TRIPLEX
            - QUARTO
            - SUITE
            - CONDOMINIO
            - RESORT
            - HOSPITAL
            - ESCOLA
            - RESTAURANTE
            - CINEMA
            - SHOPPING
          example: APARTAMENTO
        type_property_purchase:
          type: string
          enum: [FOR_SALE, FOR_RENT]
          example: FOR_RENT
        price:
          type: integer
          example: 150000
        total_area:
          type: number
          example: 120
        is_negotiable:
          type: boolean
          example: false
        status_property:
          type: string
          enum: [PUBLICADO, NAO_PUBLICADO, EM_ANALISE]
          example: EM_ANALISE
        create_at:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z

    Compartment:
      type: object
      required: [type, quantity]
      properties:
        type:
          type: string
          enum:
            - QUARTO
            - SALA_DE_ESTAR
            - SALA_DE_LAZER
            - ESCRITORIO
            - QUARTO_DE_BANHO
            - COZINHA
            - LAVANDARIA
            - GARAGEM
            - VARANDA
            - CLOSET
            - DESPENSA
            - HALL_DE_ENTRADA
            - SALA_DE_JANTAR
            - BIBLIOTECA
            - QUARTO_DE_VISITAS
            - SUITE_PRINCIPAL
            - ADEGA
            - QUARTO_DE_EMPREGADOS
            - RECEPCAO
            - SALA_DE_REUNIOES
            - AUDITORIO
            - LOJA
            - ARMAZEM
            - CANTINA
            - GINASIO
            - SPA
            - PISCINA
            - TERRAÇO
          example: QUARTO
        quantity:
          type: integer
          minimum: 1
          example: 3

    # ─── Plans ───────────────────────────────────────────────
    Plan:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Plano Básico
        description:
          type: string
          example: Ideal para começar a anunciar imóveis
        price:
          type: number
          example: 5000
        maxListings:
          type: integer
          example: 3
        durationDays:
          type: integer
          example: 30
        features:
          type: array
          items:
            type: string
          example: ["3 anúncios", "Fotos ilimitadas", "Suporte básico"]

    # ─── Negotiations ────────────────────────────────────────
    Negotiation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        property_listing_id:
          type: integer
          example: 5
        client_id:
          type: integer
          example: 3
        owner_id:
          type: integer
          example: 7
        proposed_price:
          type: number
          example: 140000
        accepted_value:
          type: number
          nullable: true
          example: null
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, CANCELLED]
          example: PENDING
        created_at:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z

    # ─── Contracts ───────────────────────────────────────────
    Contract:
      type: object
      properties:
        id:
          type: integer
          example: 1
        negotiationId:
          type: integer
          example: 1
        propertyId:
          type: integer
          example: 5
        clientId:
          type: integer
          example: 3
        ownerId:
          type: integer
          example: 7
        finalPrice:
          type: number
          example: 145000
        status:
          type: string
          enum: [DRAFT, SIGNED_BY_CLIENT, SIGNED_BY_OWNER, FULLY_SIGNED, CANCELLED]
          example: DRAFT
        fileUrl:
          type: string
          example: https://storage.kubico.com/contracts/contract_1.pdf
        createdAt:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z

    # ─── Simulation ──────────────────────────────────────────
    SimulationRequest:
      type: object
      required: [propertyId, downPayment, termMonths]
      properties:
        propertyId:
          type: integer
          example: 5
        downPayment:
          type: number
          example: 30000
        termMonths:
          type: integer
          example: 120
        interestRate:
          type: number
          example: 12.5

    SimulationResponse:
      type: object
      properties:
        propertyPrice:
          type: number
          example: 150000
        downPayment:
          type: number
          example: 30000
        loanAmount:
          type: number
          example: 120000
        termMonths:
          type: integer
          example: 120
        monthlyPayment:
          type: number
          example: 1750.50
        totalPayment:
          type: number
          example: 210060
        totalInterest:
          type: number
          example: 90060

    # ─── Listings ────────────────────────────────────────────
    Listing:
      type: object
      properties:
        id:
          type: integer
          example: 1
        property_id:
          type: integer
          example: 1
        listed_at:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z
        delisted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        status:
          type: string
          enum: [RESERVADO, VENDIDO, ALUGADO, DISPONIVEL]
          example: DISPONIVEL

    # ─── Error ───────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Invalid request parameters
        error:
          type: string
          example: Validation error

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Signup, login, logout, refresh token, verificação de email
  - name: User Management
    description: Gestão do perfil do utilizador autenticado
  - name: User Management (Admin)
    description: Endpoints administrativos de gestão de utilizadores
  - name: Role Verification
    description: Submissão de dados para verificação de perfil (owner individual/empresa)
  - name: Role Management
    description: Troca de role activa do utilizador
  - name: Properties
    description: Cadastro e gestão de imóveis
  - name: Listings
    description: Publicação e gestão de anúncios
  - name: Favorites
    description: Imóveis guardados pelo utilizador
  - name: Negotiations
    description: Negociação entre cliente e proprietário
  - name: Contracts
    description: Geração e assinatura de contratos
  - name: Simulations
    description: Simulação de pagamentos e financiamentos
  - name: Plans
    description: Planos de serviço disponíveis
  - name: Admin - Verifications
    description: Aprovação/rejeição de verificações de perfil
  - name: Admin - Properties
    description: Aprovação/rejeição de imóveis
  - name: Admin - Plans
    description: Gestão de planos de serviço

paths:

  # ═══════════════════════════════════════════════════════════
  # AUTH
  # ═══════════════════════════════════════════════════════════

  /auth/signup/{type}:
    post:
      tags: [Authentication]
      summary: "✅ Criar conta"
      description: |
        Cria uma nova conta de utilizador. O parâmetro `type` define o tipo de perfil inicial.

        - `individual` → perfil pessoal (`ProfileType.INDIVIDUAL`)
        - `company` → perfil de empresa (`ProfileType.COMPANY`)

        O `accessToken` é retornado no body e também no header `Authorization: Bearer <token>`.
        O `refreshToken` é definido como cookie `HttpOnly`.
      operationId: signup
      security: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [individual, company]
          example: individual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Conta criada com sucesso
          headers:
            Authorization:
              description: Bearer <accessToken>
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email já registado

  /auth/login:
    post:
      tags: [Authentication]
      summary: "✅ Login"
      description: |
        Autentica o utilizador com email e password.

        O `accessToken` é retornado no body e no header `Authorization`.
        O `refreshToken` é definido como cookie `HttpOnly`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login bem-sucedido
          headers:
            Authorization:
              description: Bearer <accessToken>
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: usuario com sessao iniciada!
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
        '401':
          description: Credenciais inválidas

  /auth/logout:
    get:
      tags: [Authentication]
      summary: "✅ Logout"
      description: |
        Invalida a sessão actual usando o `refreshToken` da cookie.
        Requer o cookie `refreshToken` válido (middleware `authorizeRefreshTokenMiddleware`).
      operationId: logout
      security: []
      parameters:
        - in: cookie
          name: refreshToken
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Logout bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Refresh token inválido ou expirado

  /auth/refresh:
    get:
      tags: [Authentication]
      summary: "✅ Renovar access token"
      description: |
        Gera um novo par de tokens usando o `refreshToken` guardado na cookie.
        Requer o cookie `refreshToken` válido.
      operationId: refresh
      security: []
      parameters:
        - in: cookie
          name: refreshToken
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tokens renovados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  refreshAcess:
                    $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token inválido ou expirado

  /auth/verify-email:
    get:
      tags: [Authentication]
      summary: "✅ Verificar email"
      description: Verifica o email do utilizador a partir do token enviado por email.
      operationId: verifyEmail
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Token enviado por email
      responses:
        '200':
          description: Email verificado com sucesso (resposta em texto simples)
        '400':
          description: Token inválido, expirado ou não fornecido

  /auth/send-verify-mail:
    get:
      tags: [Authentication]
      summary: "✅ Reenviar email de verificação"
      description: |
        Reenvia o email de verificação para o utilizador. 
        Requer o cookie `refreshToken` válido para identificar o utilizador.
      operationId: sendVerifyMail
      security: []
      parameters:
        - in: cookie
          name: refreshToken
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email de verificação enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Utilizador não autenticado ou dados inválidos

  /auth/create-admin:
    post:
      tags: [Authentication]
      summary: "✅ Criar administrador"
      description: |
        Cria um novo administrador. O campo `accessLevel` é convertido para maiúsculas automaticamente.
        Valores válidos: `SUPER_ADMIN`, `NORMAL`.
      operationId: createAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
      responses:
        '200':
          description: Administrador criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Admin Criado!
        '400':
          description: Dados inválidos

  # ═══════════════════════════════════════════════════════════
  # USERS
  # ═══════════════════════════════════════════════════════════

  /users/update-email:
    put:
      tags: [User Management]
      summary: "✅ Atualizar email"
      description: |
        Atualiza o email do utilizador autenticado.
        Requer `Authorization: Bearer <accessToken>` e role `NORMAL`, `CLIENT` ou `OWNER`.
      operationId: updateEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailRequest'
      responses:
        '200':
          description: Email atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '409':
          description: Email já está em uso

  /users:
    delete:
      tags: [User Management]
      summary: "✅ Apagar conta"
      description: |
        Elimina a conta do utilizador autenticado.
        Requer `Authorization: Bearer <accessToken>` e qualquer role válida (ADMIN, NORMAL, CLIENT, OWNER).
        Usa o `refreshToken` da cookie para identificar o utilizador.
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - in: cookie
          name: refreshToken
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conta eliminada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Não autorizado

  # ═══════════════════════════════════════════════════════════
  # ROLE VERIFICATION
  # ═══════════════════════════════════════════════════════════

  /profile/individual-owner:
    post:
      tags: [Role Verification]
      summary: "✅ Registar proprietário individual"
      description: |
        Envia os dados pessoais para criação do perfil de proprietário individual.
        Após submissão, o perfil fica a aguardar aprovação por um administrador.

        Requer `Authorization: Bearer <accessToken>`.
      operationId: createOwnerIndividual
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualOwnerProfileRequest'
      responses:
        '201':
          description: Proprietário cadastrado, aguardando verificação
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Proprietário cadastrado! Aguarde a verificação dos dados.
        '400':
          description: Dados inválidos

  /profile/company-owner:
    post:
      tags: [Role Verification]
      summary: "✅ Registar proprietário empresa"
      description: |
        Envia os dados empresariais para criação do perfil de proprietário empresa.
        Após submissão, o perfil fica a aguardar aprovação por um administrador.

        Requer `Authorization: Bearer <accessToken>`.
      operationId: createOwnerCompany
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyOwnerProfileRequest'
      responses:
        '201':
          description: Proprietário empresa cadastrado, aguardando verificação
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Proprietário cadastrado! Aguarde a verificação dos dados.
        '400':
          description: Dados inválidos

  # ═══════════════════════════════════════════════════════════
  # ROLE MANAGEMENT
  # ═══════════════════════════════════════════════════════════

  /assume-roles/client:
    get:
      tags: [Role Management]
      summary: "✅ Assumir role CLIENT"
      description: |
        Activa a role CLIENT para o utilizador autenticado.
        Após esta chamada, o utilizador deve chamar `GET /auth/refresh` para obter um novo access token
        com a role CLIENT activa.

        Requer `Authorization: Bearer <accessToken>` e role `CLIENT` ou `OWNER`.
      operationId: assumeClient
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role CLIENT assumida. Chame /auth/refresh para actualizar o token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '403':
          description: Utilizador não possui role de CLIENT

  /assume-roles/owner:
    get:
      tags: [Role Management]
      summary: "✅ Assumir role OWNER"
      description: |
        Activa a role OWNER para o utilizador autenticado.
        Após esta chamada, o utilizador deve chamar `GET /auth/refresh` para obter um novo access token
        com a role OWNER activa.

        Requer `Authorization: Bearer <accessToken>` e role `CLIENT` ou `OWNER`.
      operationId: assumeOwner
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role OWNER assumida. Chame /auth/refresh para actualizar o token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '403':
          description: Utilizador não possui role de OWNER

  # ═══════════════════════════════════════════════════════════
  # PROPERTIES
  # ═══════════════════════════════════════════════════════════

  /properties:
    get:
      tags: [Properties]
      summary: "✅ Listar todos os imóveis"
      description: |
        Lista imóveis com paginação por cursor.
        Requer `Authorization: Bearer <accessToken>` com role `ADMIN` ou `OWNER`.
      operationId: listProperties
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          description: ID do último imóvel retornado (para paginação)
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista de imóveis
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cursor:
                    type: integer
                  properties:
                    type: array
                    items:
                      $ref: '#/components/schemas/Property'

    post:
      tags: [Properties]
      summary: "✅ Cadastrar imóvel"
      description: |
        Cria um novo imóvel com imagens e/ou vídeo.

        **Content-Type:** `multipart/form-data`

        Requer `Authorization: Bearer <accessToken>` com role `ADMIN` ou `OWNER`.

        ---

        ### 📎 Upload de ficheiros

        | Campo do input (`name`) | Tipo | Máx. ficheiros | Tamanho máximo | Formatos aceites |
        |---|---|---|---|---|
        | `images` | Imagem | 5 | 5 MB cada | PNG, JPEG, JPG, WEBP |
        | `video` | Vídeo | 1 | 500 MB | MP4, MKV, MOV, AVI, WEBM |

        > **Pelo menos um ficheiro (imagem ou vídeo) é obrigatório.**

        ---

        ### 🗂️ Campo `compartments`

        O campo `compartments` deve ser enviado como **string JSON**. Exemplo:
        ```json
        "[{\"type\":\"QUARTO\",\"quantity\":3},{\"type\":\"QUARTO_DE_BANHO\",\"quantity\":2}]"
        ```

        ### 💰 Campo `price`

        Enviado como string (formulário), convertido internamente para número inteiro positivo.

        ### 📐 Campos numéricos (`total_area`, `latitude`, `longitude`)

        Enviados como string no formulário, convertidos internamente para número.
      operationId: createProperty
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - description
                - address_info
                - neighborhood
                - municipality
                - price
                - type_purchase
                - type_of_property
                - compartments
              properties:
                title:
                  type: string
                  example: Apartamento T3 em Talatona
                description:
                  type: string
                  example: Apartamento espaçoso com 3 quartos e varanda
                address_info:
                  type: string
                  example: Rua das Acácias, nº 12
                neighborhood:
                  type: string
                  example: Talatona
                municipality:
                  type: string
                  example: Luanda
                price:
                  type: string
                  description: Valor inteiro positivo enviado como string. Ex:"150000"
                  example: "150000"
                is_negotiable:
                  type: boolean
                  default: false
                  example: false
                type_purchase:
                  type: string
                  enum: [FOR_SALE, FOR_RENT]
                  description: Case-insensitive (convertido para maiúsculas automaticamente)
                  example: FOR_RENT
                type_of_property:
                  type: string
                  enum:
                    - APARTAMENTO
                    - VIVENDA
                    - ESCRITORIO
                    - FAZENDA
                    - TERRENO
                    - LOJA
                    - ARMAZEM
                    - HOTEL
                    - PENTHOUSE
                    - DUPLEX
                    - TRIPLEX
                    - QUARTO
                    - SUITE
                    - CONDOMINIO
                    - RESORT
                    - HOSPITAL
                    - ESCOLA
                    - RESTAURANTE
                    - CINEMA
                    - SHOPPING
                  description: Case-insensitive (convertido para maiúsculas automaticamente)
                  example: APARTAMENTO
                compartments:
                  type: string
                  description: |
                    Array de cômodos serializado como string JSON.
                    Cada item deve ter `type` (enum CompartmentsTypes) e `quantity` (inteiro positivo).
                  example: '[{"type":"QUARTO","quantity":3},{"type":"QUARTO_DE_BANHO","quantity":2}]'
                total_area:
                  type: string
                  description: Área total em m², enviada como string. Ex:"120"
                  example: "120"
                latitude:
                  type: string
                  description: Latitude geográfica enviada como string. Ex:"-8.839"
                  example: "-8.839"
                longitude:
                  type: string
                  description: Longitude geográfica enviada como string. Ex:"13.289"
                  example: "13.289"
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: |
                    Até 5 imagens. O atributo `name` do input HTML deve ser **`images`**.
                    Formatos: PNG, JPEG, JPG, WEBP. Tamanho máximo: 5 MB por ficheiro.
                video:
                  type: string
                  format: binary
                  description: |
                    Um único vídeo. O atributo `name` do input HTML deve ser **`video`**.
                    Formatos: MP4, MKV, MOV, AVI, WEBM. Tamanho máximo: 500 MB.
            encoding:
              images:
                contentType: image/png, image/jpeg, image/webp
              video:
                contentType: video/mp4, video/mkv, video/mov, video/avi, video/webm
      responses:
        '201':
          description: Imóvel criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  property:
                    $ref: '#/components/schemas/Property'
        '400':
          description: Dados inválidos ou ficheiros obrigatórios em falta
        '404':
          description: Perfil não encontrado

