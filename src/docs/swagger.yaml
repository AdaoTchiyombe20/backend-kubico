openapi: 3.0.0
info:
  title: Kubico API
  version: 1.0.0
  description: API documentation for Kubico - Plataforma web para arrendamento e venda de imóveis
  contact:
    name: Kubico Support
    email: support@kubico.com

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://api.kubico.com/api
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── Auth ───────────────────────────────────────────────
    SignUpRequest:
      type: object
      required: [name, email, phone, password]
      properties:
        name:
          type: string
          minLength: 3
          example: João Silva
        email:
          type: string
          format: email
          example: joao@example.com
        phone:
          type: string
          minLength: 9
          maxLength: 9
          example: "923456789"
        password:
          type: string
          minLength: 6
          example: password123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: joao@example.com
        password:
          type: string
          example: password123

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    # ─── User ────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: João Silva
        email:
          type: string
          example: joao@example.com
        phone:
          type: string
          example: "923456789"
        role:
          type: string
          enum: [ADMIN, NORMAL, CLIENT, OWNER]
          example: NORMAL
        createdAt:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          example: João Silva Updated
        phone:
          type: string
          pattern: ^[0-9]{9}$
          example: "923456789"
        password:
          type: string
          minLength: 6
          example: newpassword123

    UpdateEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: newemail@example.com

    # ─── Verification ────────────────────────────────────────
    IndividualClientVerification:
      type: object
      description: Enviado como multipart/form-data
      properties:
        bi:
          type: string
          format: binary
          description: Foto do Bilhete de Identidade
        selfieWithBi:
          type: string
          format: binary
          description: Selfie segurando o BI

    CompanyClientVerification:
      type: object
      description: Enviado como multipart/form-data
      properties:
        bi_representante:
          type: string
          format: binary
          description: BI do representante legal
        certidao_comercial:
          type: string
          format: binary
          description: Certidão comercial da empresa
        doc_comprovante_representante_legal_empresa:
          type: string
          format: binary
          description: Documento que comprova representação legal

    IndividualOwnerVerification:
      type: object
      description: Enviado como multipart/form-data
      properties:
        bi:
          type: string
          format: binary
          description: Foto do Bilhete de Identidade
        comprovativo_titularidade_conta_bancaria:
          type: string
          format: binary
          description: Comprovativo de titularidade da conta bancária

    CompanyOwnerVerification:
      type: object
      description: Enviado como multipart/form-data
      properties:
        comprovativo_titularidade_conta_bancaria:
          type: string
          format: binary
          description: Comprovativo de titularidade da conta bancária
        bi_representante:
          type: string
          format: binary
          description: BI do representante legal
        certidao_comercial:
          type: string
          format: binary
          description: Certidão comercial da empresa
        doc_comprovante_representante_legal_empresa:
          type: string
          format: binary
          description: Documento que comprova representação legal

    # ─── Properties ──────────────────────────────────────────
    Property:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Apartamento T3 em Talatona
        description:
          type: string
          example: Apartamento espaçoso com 3 quartos e varanda
        type:
          type: string
          enum: [APARTMENT, HOUSE, COMMERCIAL, LAND]
          example: APARTMENT
        purpose:
          type: string
          enum: [RENT, SALE]
          example: RENT
        price:
          type: number
          example: 150000
        area:
          type: number
          description: Área em m²
          example: 120
        bedrooms:
          type: integer
          example: 3
        bathrooms:
          type: integer
          example: 2
        location:
          type: object
          properties:
            province:
              type: string
              example: Luanda
            municipality:
              type: string
              example: Talatona
            address:
              type: string
              example: Rua das Acácias, nº 12
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, INACTIVE]
          example: PENDING
        ownerId:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z

    CreatePropertyRequest:
      type: object
      required: [title, description, type, purpose, price, area, location]
      properties:
        title:
          type: string
          example: Apartamento T3 em Talatona
        description:
          type: string
          example: Apartamento espaçoso com 3 quartos e varanda
        type:
          type: string
          enum: [APARTMENT, HOUSE, COMMERCIAL, LAND]
          example: APARTMENT
        purpose:
          type: string
          enum: [RENT, SALE]
          example: RENT
        price:
          type: number
          example: 150000
        area:
          type: number
          example: 120
        bedrooms:
          type: integer
          example: 3
        bathrooms:
          type: integer
          example: 2
        location:
          type: object
          required: [province, municipality, address]
          properties:
            province:
              type: string
              example: Luanda
            municipality:
              type: string
              example: Talatona
            address:
              type: string
              example: Rua das Acácias, nº 12

    CreatePropertyForm:
      type: object
      required: [title, description, address_info, neighborhood, municipality, price, type_purchase, type_of_property, compartments]
      properties:
        title:
          type: string
          example: Apartamento T3 em Talatona
        description:
          type: string
          example: Apartamento espaçoso com 3 quartos e varanda
        address_info:
          type: string
          example: Rua das Acácias, nº 12
        neighborhood:
          type: string
          example: Talatona
        municipality:
          type: string
          example: Luanda
        price:
          type: number
          example: 150000
        is_negotiable:
          type: boolean
          example: false
        type_purchase:
          type: string
          enum: [RENT, SALE]
          example: RENT
        type_of_property:
          type: string
          enum: [APARTMENT, HOUSE, COMMERCIAL, LAND]
          example: APARTMENT
        compartments:
          type: string
          description: JSON array como string, ex: [{"type":"BEDROOM","quantity":3}]
        total_area:
          type: number
          example: 120
        latitude:
          type: number
          example: -8.839
        longitude:
          type: number
          example: 13.289
        images:
          type: array
          items:
            type: string
            format: binary
        video:
          type: string
          format: binary

    UpdatePropertyInfoRequest:
      type: object
      properties:
        title:
          type: string
          example: Apartamento T3 em Talatona
        description:
          type: string
          example: Apartamento espaçoso com 3 quartos e varanda
        address_info:
          type: string
          example: Rua das Acácias, nº 12
        neighborhood:
          type: string
          example: Talatona
        municipality:
          type: string
          example: Luanda
        price:
          type: number
          example: 150000
        is_negotiable:
          type: boolean
          example: false
        type_purchase:
          type: string
          enum: [RENT, SALE]
          example: RENT
        type_of_property:
          type: string
          enum: [APARTMENT, HOUSE, COMMERCIAL, LAND]
          example: APARTMENT
        compartments:
          type: string
          description: JSON array como string, ex: [{"type":"BEDROOM","quantity":3}]
        total_area:
          type: number
          example: 120

    IndividualOwnerProfileRequest:
      type: object
      required: [ownerName, phone, bi, nif, bankAccount, dateOfBirth]
      properties:
        ownerName:
          type: string
          example: João Silva
        phone:
          type: string
          example: "923456789"
        bi:
          type: string
          example: "12345678901234"
        nif:
          type: string
          example: "123456"
        bankAccount:
          type: string
          example: "123456789012345678901"
        dateOfBirth:
          type: string
          format: date
          example: 1990-01-01

    CompanyOwnerProfileRequest:
      type: object
      required: [nameOfCompany, phone, nif, bankAccount]
      properties:
        nameOfCompany:
          type: string
          example: Empresa XYZ
        phone:
          type: string
          example: "923456789"
        nif:
          type: string
          example: "123456"
        bankAccount:
          type: string
          example: "123456789012345678901"

    # ─── Listings ────────────────────────────────────────────
    Listing:
      type: object
      properties:
        id:
          type: integer
          example: 1
        propertyId:
          type: integer
          example: 1
        planId:
          type: integer
          example: 2
        status:
          type: string
          enum: [ACTIVE, PAUSED, EXPIRED, REJECTED]
          example: ACTIVE
        expiresAt:
          type: string
          format: date-time
          example: 2026-05-14T12:00:00Z
        createdAt:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z

    # ─── Plans ───────────────────────────────────────────────
    Plan:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Plano Básico
        description:
          type: string
          example: Ideal para começar a anunciar imóveis
        price:
          type: number
          example: 5000
        maxListings:
          type: integer
          example: 3
        durationDays:
          type: integer
          example: 30
        features:
          type: array
          items:
            type: string
          example: ["3 anúncios", "Fotos ilimitadas", "Suporte básico"]

    # ─── Negotiations ────────────────────────────────────────
    Negotiation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        propertyId:
          type: integer
          example: 5
        clientId:
          type: integer
          example: 3
        ownerId:
          type: integer
          example: 7
        proposedPrice:
          type: number
          example: 140000
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, COUNTERED]
          example: PENDING
        message:
          type: string
          example: Gostaria de negociar o valor do arrendamento
        createdAt:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z

    # ─── Contracts ───────────────────────────────────────────
    Contract:
      type: object
      properties:
        id:
          type: integer
          example: 1
        negotiationId:
          type: integer
          example: 1
        propertyId:
          type: integer
          example: 5
        clientId:
          type: integer
          example: 3
        ownerId:
          type: integer
          example: 7
        finalPrice:
          type: number
          example: 145000
        status:
          type: string
          enum: [DRAFT, SIGNED_BY_CLIENT, SIGNED_BY_OWNER, FULLY_SIGNED, CANCELLED]
          example: DRAFT
        fileUrl:
          type: string
          example: https://storage.kubico.com/contracts/contract_1.pdf
        createdAt:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z

    # ─── Simulation ──────────────────────────────────────────
    SimulationRequest:
      type: object
      required: [propertyId, downPayment, termMonths]
      properties:
        propertyId:
          type: integer
          example: 5
        downPayment:
          type: number
          description: Valor de entrada
          example: 30000
        termMonths:
          type: integer
          description: Prazo em meses
          example: 120
        interestRate:
          type: number
          description: Taxa de juros anual (%)
          example: 12.5

    SimulationResponse:
      type: object
      properties:
        propertyPrice:
          type: number
          example: 150000
        downPayment:
          type: number
          example: 30000
        loanAmount:
          type: number
          example: 120000
        termMonths:
          type: integer
          example: 120
        monthlyPayment:
          type: number
          example: 1750.50
        totalPayment:
          type: number
          example: 210060
        totalInterest:
          type: number
          example: 90060

    # ─── Error ───────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Invalid request parameters
        error:
          type: string
          example: Validation error

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Signup, login, logout, refresh token, verificação de email
  - name: User Management
    description: Gestão do perfil do utilizador autenticado
  - name: User Management (Admin)
    description: Endpoints administrativos de gestão de utilizadores
  - name: Role Verification
    description: Submissão de documentos para verificação de perfil (client/owner)
  - name: Role Management
    description: Troca de role activa do utilizador
  - name: Properties
    description: Cadastro e gestão de imóveis
  - name: Listings
    description: Publicação e gestão de anúncios
  - name: Favorites
    description: Imóveis guardados pelo utilizador
  - name: Negotiations
    description: Negociação entre cliente e proprietário
  - name: Contracts
    description: Geração e assinatura de contratos
  - name: Simulations
    description: Simulação de pagamentos e financiamentos
  - name: Plans
    description: Planos de serviço disponíveis
  - name: Admin - Verifications
    description: Aprovação/rejeição de verificações de perfil
  - name: Admin - Properties
    description: Aprovação/rejeição de imóveis
  - name: Admin - Plans
    description: Gestão de planos de serviço

paths:

  # ═══════════════════════════════════════════════════════════
  # AUTH
  # ═══════════════════════════════════════════════════════════
  /auth/signup/{type}:
    post:
      tags: [Authentication]
      summary: Criar conta
      description: Cria uma nova conta de utilizador. O parâmetro `type` define o tipo de perfil inicial.
      operationId: signup
      security: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [individual, company]
          example: individual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Conta criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email já registado

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciais inválidas

  /auth/logout:
    get:
      tags: [Authentication]
      summary: Logout
      description: Invalida a sessão actual usando o refresh token da cookie.
      operationId: logout
      security: []
      responses:
        '200':
          description: Logout bem-sucedido
        '401':
          description: Refresh token inválido ou expirado

  /auth/refresh:
    get:
      tags: [Authentication]
      summary: Renovar access token
      description: Gera um novo par de tokens usando o refresh token na cookie.
      operationId: refresh
      security: []
      responses:
        '200':
          description: Tokens renovados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token inválido ou expirado

  /auth/verify-email:
    get:
      tags: [Authentication]
      summary: Verificar email
      operationId: verifyEmail
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Token enviado por email
      responses:
        '200':
          description: Email verificado com sucesso
        '400':
          description: Token inválido ou expirado

  /auth/send-verify-mail:
    get:
      tags: [Authentication]
      summary: Enviar email de verificação
      description: Solicita reenvio do email de verificação. Na implementação atual, depende da identificação do utilizador via refresh cookie.
      operationId: sendVerifyMail
      security: []
      responses:
        '200':
          description: Email de verificação enviado
        '400':
          description: Dados inválidos ou utilizador não autenticado

  /auth/create-admin:
    post:
      tags: [Authentication]
      summary: Criar administrador
      description: Cria um administrador com acesso administrativo.
      operationId: createAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminsName, email, password, accessLevel]
              properties:
                adminsName:
                  type: string
                  example: Admin Kubico
                email:
                  type: string
                  format: email
                  example: admin@kubico.com
                password:
                  type: string
                  example: strongPassword123
                accessLevel:
                  type: string
                  example: ADMIN
      responses:
        '201':
          description: Administrador criado com sucesso
        '400':
          description: Dados inválidos

  # ═══════════════════════════════════════════════════════════
  # USERS
  # ═══════════════════════════════════════════════════════════
  /users/update-email:
    put:
      tags: [User Management]
      summary: Atualizar email
      operationId: updateEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailRequest'
      responses:
        '200':
          description: Email atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Email já está em uso

  /users:
    delete:
      tags: [User Management]
      summary: Apagar conta
      operationId: deleteUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conta eliminada com sucesso
        '401':
          description: Não autorizado

  # ═══════════════════════════════════════════════════════════
  # ROLE VERIFICATION
  # ═══════════════════════════════════════════════════════════
  /profile/individual-owner:
    post:
      tags: [Role Verification]
      summary: Criar proposta de verificação para proprietário individual
      description: Envia os dados de proprietário individual para verificação.
      operationId: createOwnerIndividual
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualOwnerProfileRequest'
      responses:
        '201':
          description: Proprietário individual cadastrado, aguardando verificação
        '400':
          description: Dados inválidos

  /profile/company-owner:
    post:
      tags: [Role Verification]
      summary: Criar proposta de verificação para proprietário empresa
      description: Envia os dados de proprietário empresa para verificação.
      operationId: createOwnerCompany
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyOwnerProfileRequest'
      responses:
        '201':
          description: Proprietário empresa cadastrado, aguardando verificação
        '400':
          description: Dados inválidos

  # ═══════════════════════════════════════════════════════════
  # ROLE MANAGEMENT
  # ═══════════════════════════════════════════════════════════
  /assume-roles/client:
    get:
      tags: [Role Management]
      summary: Assumir role CLIENT
      description: Desativa todas as roles e ativa a role CLIENT. Requer role NORMAL, CLIENT ou OWNER.
      operationId: assumeClient
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role CLIENT assumida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Utilizador não possui role de CLIENT

  /assume-roles/owner:
    get:
      tags: [Role Management]
      summary: Assumir role OWNER
      description: Desativa todas as roles e ativa a role OWNER. Requer role NORMAL, CLIENT ou OWNER.
      operationId: assumeOwner
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role OWNER assumida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Utilizador não possui role de OWNER

  # ═══════════════════════════════════════════════════════════
  # PROPERTIES
  # ═══════════════════════════════════════════════════════════
  /properties:
    get:
      tags: [Properties]
      summary: Listar imóveis
      description: Lista os imóveis disponíveis para o utilizador autentificado com role ADMIN ou OWNER.
      operationId: listProperties
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista de imóveis
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cursor:
                    type: integer
                  properties:
                    type: array
                    items:
                      $ref: '#/components/schemas/Property'

    post:
      tags: [Properties]
      summary: Cadastrar imóvel
      description: Cria um novo imóvel. Requer role ADMIN ou OWNER.
      operationId: createProperty
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePropertyForm'
      responses:
        '201':
          description: Imóvel criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  property:
                    $ref: '#/components/schemas/Property'
        '400':
          description: Dados inválidos ou ficheiros obrigatórios em falta

  /properties/owner:
    get:
      tags: [Properties]
      summary: Listar imóveis do owner autenticado
      operationId: findUserProperties
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista de imóveis do owner
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cursor:
                    type: integer
                  properties:
                    type: array
                    items:
                      $ref: '#/components/schemas/Property'

  /properties/publish/{id}:
    post:
      tags: [Properties]
      summary: Publicar imóvel
