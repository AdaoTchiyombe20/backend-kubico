      responses:
        '201':
          description: Anúncio publicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '402':
          description: Sem plano ativo ou limite de anúncios atingido
        '403':
          description: Imóvel não aprovado

    get:
      tags: [Listings]
      summary: Listar anúncios ativos
      operationId: getListings
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de anúncios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Listing'

