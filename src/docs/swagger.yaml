openapi: 3.0.0
info:
  title: Kubico API
  version: 1.0.0
  description: API documentation for Kubico - Plataforma web para arrendamento e venda de imóveis
  contact:
    name: Kubico Support
    email: support@kubico.com

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://api.kubico.com/api
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── Auth ───────────────────────────────────────────────
    SignUpRequest:
      type: object
      required: [name, email, phone, password]
      properties:
        name:
          type: string
          minLength: 3
          example: João Silva
        email:
          type: string
          format: email
          example: joao@example.com
        phone:
          type: string
          minLength: 9
          maxLength: 9
          example: "923456789"
        password:
          type: string
          minLength: 6
          example: password123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: joao@example.com
        password:
          type: string
          example: password123

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    # ─── User ────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: João Silva
        email:
          type: string
          example: joao@example.com
        phone:
          type: string
          example: "923456789"
        role:
          type: string
          enum: [ADMIN, NORMAL, CLIENT, OWNER]
          example: NORMAL
        createdAt:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          example: João Silva Updated
        phone:
          type: string
          pattern: ^[0-9]{9}$
          example: "923456789"
        password:
          type: string
          minLength: 6
          example: newpassword123

    UpdateEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: newemail@example.com

    # ─── Verification ────────────────────────────────────────
    IndividualClientVerification:
      type: object
      description: Enviado como multipart/form-data
      properties:
        bi:
          type: string
          format: binary
          description: Foto do Bilhete de Identidade
        selfieWithBi:
          type: string
          format: binary
          description: Selfie segurando o BI

    CompanyClientVerification:
      type: object
      description: Enviado como multipart/form-data
      properties:
        bi_representante:
          type: string
          format: binary
          description: BI do representante legal
        certidao_comercial:
          type: string
          format: binary
          description: Certidão comercial da empresa
        doc_comprovante_representante_legal_empresa:
          type: string
          format: binary
          description: Documento que comprova representação legal

    IndividualOwnerVerification:
      type: object
      description: Enviado como multipart/form-data
      properties:
        bi:
          type: string
          format: binary
          description: Foto do Bilhete de Identidade
        comprovativo_titularidade_conta_bancaria:
          type: string
          format: binary
          description: Comprovativo de titularidade da conta bancária

    CompanyOwnerVerification:
      type: object
      description: Enviado como multipart/form-data
      properties:
        comprovativo_titularidade_conta_bancaria:
          type: string
          format: binary
          description: Comprovativo de titularidade da conta bancária
        bi_representante:
          type: string
          format: binary
          description: BI do representante legal
        certidao_comercial:
          type: string
          format: binary
          description: Certidão comercial da empresa
        doc_comprovante_representante_legal_empresa:
          type: string
          format: binary
          description: Documento que comprova representação legal

    # ─── Properties ──────────────────────────────────────────
    Property:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Apartamento T3 em Talatona
        description:
          type: string
          example: Apartamento espaçoso com 3 quartos e varanda
        type:
          type: string
          enum: [APARTMENT, HOUSE, COMMERCIAL, LAND]
          example: APARTMENT
        purpose:
          type: string
          enum: [RENT, SALE]
          example: RENT
        price:
          type: number
          example: 150000
        area:
          type: number
          description: Área em m²
          example: 120
        bedrooms:
          type: integer
          example: 3
        bathrooms:
          type: integer
          example: 2
        location:
          type: object
          properties:
            province:
              type: string
              example: Luanda
            municipality:
              type: string
              example: Talatona
            address:
              type: string
              example: Rua das Acácias, nº 12
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, INACTIVE]
          example: PENDING
        ownerId:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z

    CreatePropertyRequest:
      type: object
      required: [title, description, type, purpose, price, area, location]
      properties:
        title:
          type: string
          example: Apartamento T3 em Talatona
        description:
          type: string
          example: Apartamento espaçoso com 3 quartos e varanda
        type:
          type: string
          enum: [APARTMENT, HOUSE, COMMERCIAL, LAND]
          example: APARTMENT
        purpose:
          type: string
          enum: [RENT, SALE]
          example: RENT
        price:
          type: number
          example: 150000
        area:
          type: number
          example: 120
        bedrooms:
          type: integer
          example: 3
        bathrooms:
          type: integer
          example: 2
        location:
          type: object
          required: [province, municipality, address]
          properties:
            province:
              type: string
              example: Luanda
            municipality:
              type: string
              example: Talatona
            address:
              type: string
              example: Rua das Acácias, nº 12

    # ─── Listings ────────────────────────────────────────────
    Listing:
      type: object
      properties:
        id:
          type: integer
          example: 1
        propertyId:
          type: integer
          example: 1
        planId:
          type: integer
          example: 2
        status:
          type: string
          enum: [ACTIVE, PAUSED, EXPIRED, REJECTED]
          example: ACTIVE
        expiresAt:
          type: string
          format: date-time
          example: 2026-05-14T12:00:00Z
        createdAt:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z

    # ─── Plans ───────────────────────────────────────────────
    Plan:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Plano Básico
        description:
          type: string
          example: Ideal para começar a anunciar imóveis
        price:
          type: number
          example: 5000
        maxListings:
          type: integer
          example: 3
        durationDays:
          type: integer
          example: 30
        features:
          type: array
          items:
            type: string
          example: ["3 anúncios", "Fotos ilimitadas", "Suporte básico"]

    # ─── Negotiations ────────────────────────────────────────
    Negotiation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        propertyId:
          type: integer
          example: 5
        clientId:
          type: integer
          example: 3
        ownerId:
          type: integer
          example: 7
        proposedPrice:
          type: number
          example: 140000
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, COUNTERED]
          example: PENDING
        message:
          type: string
          example: Gostaria de negociar o valor do arrendamento
        createdAt:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z

    # ─── Contracts ───────────────────────────────────────────
    Contract:
      type: object
      properties:
        id:
          type: integer
          example: 1
        negotiationId:
          type: integer
          example: 1
        propertyId:
          type: integer
          example: 5
        clientId:
          type: integer
          example: 3
        ownerId:
          type: integer
          example: 7
        finalPrice:
          type: number
          example: 145000
        status:
          type: string
          enum: [DRAFT, SIGNED_BY_CLIENT, SIGNED_BY_OWNER, FULLY_SIGNED, CANCELLED]
          example: DRAFT
        fileUrl:
          type: string
          example: https://storage.kubico.com/contracts/contract_1.pdf
        createdAt:
          type: string
          format: date-time
          example: 2026-02-14T12:00:00Z

    # ─── Simulation ──────────────────────────────────────────
    SimulationRequest:
      type: object
      required: [propertyId, downPayment, termMonths]
      properties:
        propertyId:
          type: integer
          example: 5
        downPayment:
          type: number
          description: Valor de entrada
          example: 30000
        termMonths:
          type: integer
          description: Prazo em meses
          example: 120
        interestRate:
          type: number
          description: Taxa de juros anual (%)
          example: 12.5

    SimulationResponse:
      type: object
      properties:
        propertyPrice:
          type: number
          example: 150000
        downPayment:
          type: number
          example: 30000
        loanAmount:
          type: number
          example: 120000
        termMonths:
          type: integer
          example: 120
        monthlyPayment:
          type: number
          example: 1750.50
        totalPayment:
          type: number
          example: 210060
        totalInterest:
          type: number
          example: 90060

    # ─── Error ───────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Invalid request parameters
        error:
          type: string
          example: Validation error

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Signup, login, logout, refresh token, verificação de email
  - name: User Management
    description: Gestão do perfil do utilizador autenticado
  - name: User Management (Admin)
    description: Endpoints administrativos de gestão de utilizadores
  - name: Role Verification
    description: Submissão de documentos para verificação de perfil (client/owner)
  - name: Role Management
    description: Troca de role activa do utilizador
  - name: Properties
    description: Cadastro e gestão de imóveis
  - name: Listings
    description: Publicação e gestão de anúncios
  - name: Favorites
    description: Imóveis guardados pelo utilizador
  - name: Negotiations
    description: Negociação entre cliente e proprietário
  - name: Contracts
    description: Geração e assinatura de contratos
  - name: Simulations
    description: Simulação de pagamentos e financiamentos
  - name: Plans
    description: Planos de serviço disponíveis
  - name: Admin - Verifications
    description: Aprovação/rejeição de verificações de perfil
  - name: Admin - Properties
    description: Aprovação/rejeição de imóveis
  - name: Admin - Plans
    description: Gestão de planos de serviço

paths:

  # ═══════════════════════════════════════════════════════════
  # AUTH
  # ═══════════════════════════════════════════════════════════
  /auth/signup/{type}:
    post:
      tags: [Authentication]
      summary: Criar conta
      description: Cria uma nova conta de utilizador. O parâmetro `type` define o tipo de perfil inicial.
      operationId: signup
      security: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [individual, company]
          example: individual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Conta criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email já registado

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciais inválidas

  /auth/logout:
    get:
      tags: [Authentication]
      summary: Logout
      description: Invalida a sessão actual (refresh token)
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout bem-sucedido
        '401':
          description: Token inválido ou expirado

  /auth/refresh:
    get:
      tags: [Authentication]
      summary: Renovar access token
      description: Revoga a sessão actual e gera um novo par de tokens
      operationId: refresh
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tokens renovados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token inválido ou expirado

  /auth/verify-email:
    get:
      tags: [Authentication]
      summary: Verificar email
      operationId: verifyEmail
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Token enviado por email
      responses:
        '200':
          description: Email verificado com sucesso
        '400':
          description: Token inválido ou expirado

  # ═══════════════════════════════════════════════════════════
  # USERS
  # ═══════════════════════════════════════════════════════════
  /users/update-email:
    put:
      tags: [User Management]
      summary: Atualizar email
      operationId: updateEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailRequest'
      responses:
        '200':
          description: Email atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Email já está em uso

  /users:
    delete:
      tags: [User Management]
      summary: Apagar conta
      operationId: deleteUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conta eliminada com sucesso
        '401':
          description: Não autorizado

    get:
      tags: [User Management (Admin)]
      summary: Listar todos os utilizadores
      description: Requer role ADMIN
      operationId: getAllUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: role
          in: query
          schema:
            type: string
            enum: [ADMIN, NORMAL, CLIENT, OWNER]
      responses:
        '200':
          description: Lista de utilizadores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          description: Acesso restrito a admins

  /users/{id}:
    get:
      tags: [User Management (Admin)]
      summary: Buscar utilizador por ID
      description: Requer role ADMIN
      operationId: findUserById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Utilizador encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Utilizador não encontrado

  # ═══════════════════════════════════════════════════════════
  # ROLE VERIFICATION
  # ═══════════════════════════════════════════════════════════
  /users/verify/individual-client:
    post:
      tags: [Role Verification]
      summary: Verificação de cliente individual
      description: Submete documentos para verificação como cliente pessoa física. Requer autenticação.
      operationId: verifyIndividualClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IndividualClientVerification'
      responses:
        '201':
          description: Documentos submetidos, verificação em análise
        '400':
          description: Ficheiros em falta ou inválidos
        '409':
          description: Verificação já submetida

  /users/verify/company-client:
    post:
      tags: [Role Verification]
      summary: Verificação de cliente empresa
      description: Submete documentos para verificação como cliente pessoa jurídica
      operationId: verifyCompanyClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyClientVerification'
      responses:
        '201':
          description: Documentos submetidos, verificação em análise
        '400':
          description: Ficheiros em falta ou inválidos

  /users/verify/individual-owner:
    post:
      tags: [Role Verification]
      summary: Verificação de proprietário individual
      description: Submete documentos para verificação como proprietário pessoa física
      operationId: verifyIndividualOwner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IndividualOwnerVerification'
      responses:
        '201':
          description: Documentos submetidos, verificação em análise
        '400':
          description: Ficheiros em falta ou inválidos

  /users/verify/company-owner:
    post:
      tags: [Role Verification]
      summary: Verificação de proprietário empresa
      description: Submete documentos para verificação como proprietário pessoa jurídica
      operationId: verifyCompanyOwner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyOwnerVerification'
      responses:
        '201':
          description: Documentos submetidos, verificação em análise
        '400':
          description: Ficheiros em falta ou inválidos

  # ═══════════════════════════════════════════════════════════
  # ROLE MANAGEMENT
  # ═══════════════════════════════════════════════════════════
  /assume-roles/client:
    get:
      tags: [Role Management]
      summary: Assumir role CLIENT
      description: Desativa todas as roles e ativa a role CLIENT. Requer role NORMAL, CLIENT ou OWNER.
      operationId: assumeClient
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role CLIENT assumida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Utilizador não possui role de CLIENT

  /assume-roles/owner:
    get:
      tags: [Role Management]
      summary: Assumir role OWNER
      description: Desativa todas as roles e ativa a role OWNER. Requer role NORMAL, CLIENT ou OWNER.
      operationId: assumeOwner
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role OWNER assumida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          description: Utilizador não possui role de OWNER

  # ═══════════════════════════════════════════════════════════
  # PROPERTIES
  # ═══════════════════════════════════════════════════════════
  /properties:
    get:
      tags: [Properties]
      summary: Listar imóveis
      description: Lista imóveis aprovados com filtros opcionais. Público.
      operationId: listProperties
      security: []
      parameters:
        - name: purpose
          in: query
          schema:
            type: string
            enum: [RENT, SALE]
        - name: type
          in: query
          schema:
            type: string
            enum: [APARTMENT, HOUSE, COMMERCIAL, LAND]
        - name: province
          in: query
          schema:
            type: string
            example: Luanda
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: bedrooms
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de imóveis
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Property'
                  total:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer

    post:
      tags: [Properties]
      summary: Cadastrar imóvel
      description: Cria um novo imóvel. Requer role OWNER e verificação aprovada.
      operationId: createProperty
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
      responses:
        '201':
          description: Imóvel criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '403':
          description: Requer role OWNER verificado

  /properties/my-properties:
    get:
      tags: [Properties]
      summary: Meus imóveis
      description: Lista os imóveis do owner autenticado
      operationId: getMyProperties
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de imóveis do owner
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'

  /properties/{id}:
    get:
      tags: [Properties]
      summary: Detalhe de imóvel
      operationId: getProperty
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Imóvel encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '404':
          description: Imóvel não encontrado

    put:
      tags: [Properties]
      summary: Atualizar imóvel
      description: Requer ser o owner do imóvel
      operationId: updateProperty
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
      responses:
        '200':
          description: Imóvel atualizado
        '403':
          description: Sem permissão para editar este imóvel
        '404':
          description: Imóvel não encontrado

    delete:
      tags: [Properties]
      summary: Remover imóvel
      operationId: deleteProperty
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Imóvel removido
        '403':
          description: Sem permissão

  /properties/{id}/images:
    post:
      tags: [Properties]
      summary: Adicionar fotos ao imóvel
      operationId: uploadPropertyImages
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
