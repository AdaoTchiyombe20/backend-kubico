        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Proposta aceite

  /negotiations/{id}/reject:
    put:
      tags: [Negotiations]
      summary: Rejeitar proposta
      operationId: rejectNegotiation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Proposta rejeitada

  /negotiations/{id}/counter:
    put:
