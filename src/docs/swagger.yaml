                $ref: '#/components/schemas/Listing'

    delete:
      tags: [Listings]
      summary: Despublicar anúncio
      operationId: deleteListing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Anúncio removido

  /listings/{id}/pause:
